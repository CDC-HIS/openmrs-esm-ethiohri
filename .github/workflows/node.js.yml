name: Node.js CI

on:
  push:
    branches: [devv1]
  release:
    types:
      - created

env:
  ESM_NAME: "@icap-ethiopia/esm-ethiohri-app"
  JS_NAME: "openmrs-esm-ethiohri-app.js"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "18"

      - run: yarn
      - run: yarn lint
      - run: yarn coverage
      - run: yarn typescript
      - run: yarn build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
